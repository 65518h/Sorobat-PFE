<div class="line-edit-container">
  
  <!-- Header -->
  <div class="form-header">
    <div class="header-content">
      <div class="header-left">
        <button class="back-btn" (click)="cancel()" matTooltip="Retour">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <div class="header-title">
          <h1>Modifier le véhicule</h1>
          <p>Modifiez les informations du véhicule pointé</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-cancel" (click)="cancel()">
          <mat-icon>close</mat-icon>
          <span>Annuler</span>
        </button>
        <button class="btn-submit" (click)="onSubmit()" [disabled]="submitting">
          <mat-icon>save</mat-icon>
          <span>Enregistrer</span>
          <div class="btn-spinner" *ngIf="submitting"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Chargement...</p>
  </div>

  <!-- Formulaire -->
  <form [formGroup]="lineForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="form-card">
      <div class="card-header">
        <mat-icon>directions_car</mat-icon>
        <h2>Informations du véhicule</h2>
      </div>
      <div class="card-body">
        <div class="form-grid">
          
          <!-- Code véhicule (lecture seule) -->
          <div class="form-field">
            <label>Code véhicule</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="vehiculeNo">
            </mat-form-field>
          </div>
          
          <!-- Description (lecture seule) -->
          <div class="form-field">
            <label>Description</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="description">
            </mat-form-field>
          </div>
          
          <!-- Statut -->
          <div class="form-field">
            <label>Statut</label>
            <mat-form-field appearance="outline">
              <mat-select formControlName="status">
                <mat-option value="Fonctionnel">✅ Fonctionnel</mat-option>
                <mat-option value="Panne">⚠️ En panne</mat-option>
                <mat-option value="Accident">💥 Accident</mat-option>
                <mat-option value="Mauvais Temps">🌧️ Mauvais Temps</mat-option>
                <mat-option value="Disponible">🟢 Disponible</mat-option>
                <mat-option value="Réformé">❌ Réformé</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          
          <!-- Heures travaillées -->
          <div class="form-field">
            <label>Heures travaillées *</label>
            <mat-form-field appearance="outline">
              <input matInput type="number" formControlName="hoursWorked" step="0.5" (change)="updateDistance()">
            </mat-form-field>
          </div>
          
          <!-- Index départ -->
          <div class="form-field">
            <label>Index départ *</label>
            <mat-form-field appearance="outline">
              <input matInput type="number" formControlName="startIndex" (change)="updateDistance()">
            </mat-form-field>
          </div>
          
          <!-- Index fin -->
          <div class="form-field">
            <label>Index fin *</label>
            <mat-form-field appearance="outline">
              <input matInput type="number" formControlName="endIndex" (change)="updateDistance()">
            </mat-form-field>
          </div>
          
          <!-- Distance (calculée automatiquement) -->
          <div class="form-field">
            <label>Distance (km)</label>
            <mat-form-field appearance="outline">
              <input matInput type="number" [value]="getDistance()" disabled>
              <span matSuffix>km</span>
            </mat-form-field>
          </div>
          
          <!-- Carburant (Lecture seule) -->
          <div class="form-field">
            <label>Carburant (L) (Lecture seule)</label>
            <mat-form-field appearance="outline">
              <input matInput type="number" formControlName="fuelConsumed" step="0.1">
            </mat-form-field>
          </div>
          
          <!-- Motif de panne (si applicable) -->
          <div class="form-field full-width" *ngIf="lineForm.get('breakdownMotiv')?.value">
            <label>Motif de panne</label>
            <mat-form-field appearance="outline">
              <input matInput formControlName="breakdownMotiv">
            </mat-form-field>
          </div>
          
        </div>
      </div>
    </div>
  </form>
  
</div>
