<!-- navbar.component.html -->

<mat-toolbar class="navbar">
  <!-- Bande décorative supérieure animée -->
  <div class="navbar-decoration"></div>
  


  <div class="navbar-container">
    <!-- Section Gauche -->
    <div class="navbar-left">
      <button 
        mat-icon-button 
        class="menu-button" 
        (click)="toggleMenu()" 
        matTooltip="Menu principal"
        matTooltipPosition="right"
        [class.menu-active]="isSidebarOpen">
        <div class="menu-icon-wrapper">
          <mat-icon [class.rotated]="isSidebarOpen">menu</mat-icon>
          <div class="menu-pulse"></div>
        </div>
        <div class="menu-ripple"></div>
      </button>

      <div class="navbar-brand" routerLink="/dashboard">
        <div class="logo-wrapper">
          <img src="logo.jpg" alt="SOROUBAT" class="logo">
          <div class="logo-glow"></div>
          <div class="logo-shine"></div>
          <div class="logo-ring"></div>
        </div>
        <div class="brand-text">
          <span class="app-title">
            SOROUBAT
            <span class="title-dot"></span>
          </span>
          <span class="app-subtitle">Gestion de chantiers</span>
       
        </div>
      </div>
    </div>

    <!-- Espace flexible -->
    <span class="spacer"></span>

    <!-- Section Droite -->
    <div class="navbar-right">
      
      <!-- Groupe d'actions rapides -->
      <div class="actions-group">
        <button mat-icon-button class="action-btn tasks-btn" matBadgeColor="accent">
          <mat-icon>assignment</mat-icon>
          <span class="btn-tooltip">
            <span class="tooltip-icon">📋</span>
            Tâches
          </span>
          <span class="btn-ripple"></span>
        </button>

        <button mat-icon-button class="action-btn notifications-btn"  matBadgeColor="warn">
          <mat-icon>notifications</mat-icon>
          <span class="notification-dot"></span>
          <span class="notification-bell-ring"></span>
          <span class="btn-tooltip">
            <span class="tooltip-icon">🔔</span>
            Notifications
          </span>
          <span class="btn-ripple"></span>
        </button>

        <button mat-icon-button class="action-btn messages-btn">
          <mat-icon>chat</mat-icon>
          
          <span class="btn-tooltip">
            <span class="tooltip-icon">💬</span>
            Messages
          </span>
          <span class="btn-ripple"></span>
        </button>

        <button mat-icon-button class="action-btn calendar-btn">
          <mat-icon>calendar_today</mat-icon>
          <span class="btn-tooltip">
            <span class="tooltip-icon">📅</span>
            Calendrier
          </span>
          <span class="btn-ripple"></span>
        </button>
      </div>

     

      <!-- Section Utilisateur Premium -->
      <div class="user-section">
        <button mat-button [matMenuTriggerFor]="menu" class="user-button modern-user">

      <!-- Avatar avec initiales -->
     <div class="account-wrapper">
      
      <!-- Avatar -->
      <div class="user-avatar modern-avatar">
        <span class="avatar-initials">
          {{ userName.charAt(0) || 'U' }}
        </span>
        <div class="status-indicator online"></div>
      </div>

      <!-- Infos -->
      <div class="user-info modern-user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">Chef de chantier</span>
      </div>

    </div>

    </button>
        
        <mat-menu #menu="matMenu" class="user-menu" xPosition="before">
          <div class="user-menu-header">
            <div class="menu-user-avatar">
              <mat-icon>account_circle</mat-icon>
              <div class="avatar-status online"></div>
              <div class="avatar-glow"></div>
            </div>
            <div class="menu-user-info">
              <div class="menu-user-name">{{ userName }}</div>
              <div class="menu-user-email">admin@soroubat.com</div>
     
            </div>
          </div>
          
         
          
          <mat-divider></mat-divider>
          
          <button mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Mon profil</span>
           
          </button>
          
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon>
            <span>Paramètres</span>
          
          </button>
          
          <button mat-menu-item routerLink="/help">
            <mat-icon>help_outline</mat-icon>
            <span>Centre d'aide</span>
           
          </button>
          
          <mat-divider></mat-divider>
          
          <button mat-menu-item (click)="logout()" class="logout-item">
            <mat-icon>exit_to_app</mat-icon>
            <span>Déconnexion</span>
         
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
</mat-toolbar>
