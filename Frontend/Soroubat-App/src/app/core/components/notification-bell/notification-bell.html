<!-- src/app/core/components/notification-bell/notification-bell.component.html -->

<button class="notification-bell" 
        [class.has-alerts]="unreadCount.total > 0"
        (click)="openNotificationDialog()"
        matTooltip="Notifications">
  
  <div class="bell-wrapper">
    <mat-icon class="bell-icon">notifications</mat-icon>
    <div class="bell-ring" *ngIf="unreadCount.critical > 0">
      <div class="ring-wave"></div>
      <div class="ring-wave delay-1"></div>
      <div class="ring-wave delay-2"></div>
    </div>
    <div class="bell-pulse" *ngIf="unreadCount.total > 0"></div>
  </div>
  
  
  
</button>
