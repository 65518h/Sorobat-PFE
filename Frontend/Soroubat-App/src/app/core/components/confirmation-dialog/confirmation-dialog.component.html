<!-- src/app/core/components/confirmation-dialog/confirmation-dialog.component.html -->

<div class="confirmation-dialog">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button [color]="data.cancelColor" (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    <button mat-raised-button [color]="data.confirmColor" (click)="onConfirm()" cdkFocusInitial>
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
